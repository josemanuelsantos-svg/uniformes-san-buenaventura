services:
  - type: web
    name: uniformes-san-buenaventura
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: uniformes@sanbuenaventura.org
      - key: SMTP_PASS
        value: ateessoohsmkwctd
      - key: SMTP_FROM
        value: uniformes@sanbuenaventura.org
      - key: SMTP_FROM_NAME
        value: Colegio San Buenaventura
      - key: SMTP_SSL
        value: "1"
