<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <!-- Pantalon Vestir Largo San Buenaventura -->
  <g filter="url(#card-shadow)">
    <!-- Waistband -->
    <path d="M66 42 L134 42 L134 52 L66 52 Z" fill="#475569" stroke="#334155" stroke-width="1" rx="2"/>
    <!-- Button & Belt Loops -->
    <circle cx="100" cy="47" r="2" fill="#1E293B" stroke="#94A3B8" stroke-width="0.6"/>
    <rect x="72" y="42" width="3" height="10" fill="#334155"/>
    <rect x="86" y="42" width="3" height="10" fill="#334155"/>
    <rect x="111" y="42" width="3" height="10" fill="#334155"/>
    <rect x="125" y="42" width="3" height="10" fill="#334155"/>
    <!-- Trouser Legs -->
    <path d="M66 52 L56 168 L92 168 L100 86 L108 168 L144 168 L134 52 Z" fill="#5A697E" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Fly seam & pockets -->
    <path d="M100 52 L100 78 C100 82 96 84 92 84" fill="none" stroke="#334155" stroke-width="1.2"/>
    <path d="M68 56 L82 72" stroke="#334155" stroke-width="1.2"/>
    <path d="M132 56 L118 72" stroke="#334155" stroke-width="1.2"/>
    <!-- Center Press Creases -->
    <line x1="74" y1="66" x2="74" y2="166" stroke="#475569" stroke-width="1.2" opacity="0.7"/>
    <line x1="126" y1="66" x2="126" y2="166" stroke="#475569" stroke-width="1.2" opacity="0.7"/>
    <!-- Bottom Hem cuffs -->
    <line x1="56" y1="163" x2="92" y2="163" stroke="#475569" stroke-width="1"/>
    <line x1="108" y1="163" x2="144" y2="163" stroke="#475569" stroke-width="1"/>
  </g>

</svg>