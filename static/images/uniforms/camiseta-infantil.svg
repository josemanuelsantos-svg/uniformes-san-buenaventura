<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <!-- Camiseta de Manga Corta Infantil CSB -->
  <g filter="url(#card-shadow)">
    <!-- Cuerpo de la camiseta (Blanco) -->
    <path d="M62 55 L78 42 L100 52 L122 42 L138 55 L134 165 C134 168 131 170 128 170 L72 170 C69 170 66 168 66 165 L66 85 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Manga derecha (Blanca con ribete azul) -->
    <path d="M62 55 L34 82 L52 98 L66 85 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M34 82 L52 98" stroke="#002B66" stroke-width="3.5"/>
    <!-- Manga izquierda (Blanca con ribete azul) -->
    <path d="M138 55 L166 82 L148 98 L134 85 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M166 82 L148 98" stroke="#002B66" stroke-width="3.5"/>
    <!-- Cuello redondo azul marino CSB -->
    <path d="M78 42 Q100 62 122 42" fill="none" stroke="#002B66" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Escudo CSB en el pecho izquierdo -->
    <g transform="translate(116,84) scale(0.65)">
      <circle cx="0" cy="-2" r="14" fill="#FFFFFF" opacity="0.3"/>
      <!-- Figura central -->
      <circle cx="0" cy="-11" r="4.2" fill="#005CB9"/>
      <path d="M-3.5 -5 L3.5 -5 C4.5 -5 5.5 -4 5.5 -2.5 L5.5 10 C5.5 11 4.5 12 3.5 12 L-3.5 12 C-4.5 12 -5.5 11 -5.5 10 L-5.5 -2.5 C-5.5 -4 -4.5 -5 -3.5 -5 Z" fill="#F5A623"/>
      <!-- Figura izquierda -->
      <circle cx="-7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M-10.5 -1 L-4.5 -1 C-3.8 -1 -3.3 -0.5 -3.3 0.5 L-3.3 9 C-3.3 10 -3.8 10.5 -4.5 10.5 L-10.5 10.5 C-11.2 10.5 -11.7 10 -11.7 9 L-11.7 0.5 C-11.7 -0.5 -11.2 -1 -10.5 -1 Z" fill="#005CB9"/>
      <!-- Figura derecha con cruz Tau -->
      <circle cx="7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M4.5 -1 L10.5 -1 C11.2 -1 11.7 -0.5 11.7 0.5 L11.7 9 C11.7 10 11.2 10.5 10.5 10.5 L4.5 10.5 C3.8 10.5 3.3 10 3.3 9 L3.3 0.5 C3.3 -0.5 3.8 -1 4.5 -1 Z" fill="#005CB9"/>
      <path d="M6 2 L9 2 M7.5 2 L7.5 6" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </g>
</svg>
