<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <!-- Jersey Escolar San Buenaventura -->
  <g filter="url(#card-shadow)">
    <!-- Inner polo collar peek -->
    <polygon points="100,50 82,62 100,80 118,62" fill="#8EBEEC"/>
    <path d="M82 62 L100 80" stroke="#0C4A9E" stroke-width="2"/>
    <path d="M118 62 L100 80" stroke="#0C4A9E" stroke-width="2"/>
    <!-- Jersey Body & Sleeves -->
    <path d="M58 54 L76 44 L100 48 L124 44 L142 54 L172 118 L152 125 L136 86 L136 158 L64 158 L64 86 L48 125 L28 118 Z" fill="#205E86" stroke="#164563" stroke-width="1.5"/>
    <!-- V-Neck Neckline Ribbing -->
    <path d="M76 44 L100 88 L124 44" fill="none" stroke="#174868" stroke-width="6" stroke-linejoin="round"/>
    <path d="M78 44 L100 85 L122 44" fill="none" stroke="#266E9C" stroke-width="2" stroke-linejoin="round"/>
    <!-- Ribbed Cuffs -->
    <rect x="26" y="116" width="23" height="12" rx="2" transform="rotate(18 37 122)" fill="#174868"/>
    <rect x="151" y="116" width="23" height="12" rx="2" transform="rotate(-18 162 122)" fill="#174868"/>
    <!-- Ribbed Hem Waistband -->
    <rect x="64" y="156" width="72" height="14" rx="3" fill="#174868"/>
    <line x1="64" y1="160" x2="136" y2="160" stroke="#25658F" stroke-width="1"/>
    <line x1="64" y1="164" x2="136" y2="164" stroke="#25658F" stroke-width="1"/>
    <!-- Chest Embroidery -->
    
    <!-- Official CSB Emblem -->
    <g transform="translate(116,92) scale(0.6)">
      <!-- Shadow/backing subtle glow -->
      <circle cx="0" cy="-2" r="14" fill="#FFFFFF" opacity="0.2"/>
      <!-- Center figure (Gold body, Blue head) -->
      <circle cx="0" cy="-11" r="4.2" fill="#005CB9"/>
      <path d="M-3.5 -5 L3.5 -5 C4.5 -5 5.5 -4 5.5 -2.5 L5.5 10 C5.5 11 4.5 12 3.5 12 L-3.5 12 C-4.5 12 -5.5 11 -5.5 10 L-5.5 -2.5 C-5.5 -4 -4.5 -5 -3.5 -5 Z" fill="#F5A623"/>
      <!-- Left figure (Gold head, Blue body) -->
      <circle cx="-7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M-10.5 -1 L-4.5 -1 C-3.8 -1 -3.3 -0.5 -3.3 0.5 L-3.3 9 C-3.3 10 -3.8 10.5 -4.5 10.5 L-10.5 10.5 C-11.2 10.5 -11.7 10 -11.7 9 L-11.7 0.5 C-11.7 -0.5 -11.2 -1 -10.5 -1 Z" fill="#005CB9"/>
      <!-- Right figure (Gold head, Blue body with Tau) -->
      <circle cx="7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M4.5 -1 L10.5 -1 C11.2 -1 11.7 -0.5 11.7 0.5 L11.7 9 C11.7 10 11.2 10.5 10.5 10.5 L4.5 10.5 C3.8 10.5 3.3 10 3.3 9 L3.3 0.5 C3.3 -0.5 3.8 -1 4.5 -1 Z" fill="#005CB9"/>
      <!-- White Tau Cross -->
      <path d="M6 2 L9 2 M7.5 2 L7.5 6" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    
    <text x="116" y="107" font-family="sans-serif" font-size="3.2" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="0.9">SAN BUENAVENTURA</text>
  </g>

</svg>