<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Sombra suave para realce tridimensional -->
    <filter id="jersey-shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F2847" flood-opacity="0.12"/>
    </filter>
    
    <!-- Fondo limpio con degradado sutil -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>

    <!-- Azul principal del jersey: azul colegial claro, luminoso y elegante -->
    <linearGradient id="jersey-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3488CA"/>
      <stop offset="50%" stop-color="#2678B8"/>
      <stop offset="100%" stop-color="#1B66A4"/>
    </linearGradient>

    <!-- Mangas con degradado coordinado -->
    <linearGradient id="sleeve-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A8ECC"/>
      <stop offset="100%" stop-color="#206EA8"/>
    </linearGradient>

    <linearGradient id="sleeve-right-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A8ECC"/>
      <stop offset="100%" stop-color="#206EA8"/>
    </linearGradient>

    <!-- Cuello canalé y remates -->
    <linearGradient id="rib-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C65A0"/>
      <stop offset="100%" stop-color="#145284"/>
    </linearGradient>
  </defs>

  <!-- Tarjeta contenedora -->
  <rect width="200" height="200" fill="url(#card-bg)" rx="20"/>

  <g filter="url(#jersey-shadow)">
    <!-- 1. Cuello interior del polo celeste asomando por el escote en pico -->
    <g id="polo-collar-peek">
      <!-- Fondo cuello interior -->
      <polygon points="100,50 82,63 100,82 118,63" fill="#A5CEF2"/>
      <!-- Solapas del polo celeste oficial -->
      <path d="M82,61 L100,82 L88,68 Z" fill="#8EBEEC"/>
      <path d="M118,61 L100,82 L112,68 Z" fill="#8EBEEC"/>
      <!-- Ribete azul marino del polo -->
      <path d="M82,60 L100,80" stroke="#003E8A" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M118,60 L100,80" stroke="#003E8A" stroke-width="1.8" stroke-linecap="round"/>
      <!-- Botoncito de polo visible -->
      <circle cx="100" cy="74" r="1.3" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.5"/>
    </g>

    <!-- 2. Cuerpo del jersey y mangas -->
    <!-- Manga izquierda (vista espectador) -->
    <path d="M58 53 L28 116 L48 123 L65 82 Z" fill="url(#sleeve-left-grad)" stroke="#1B629B" stroke-width="1"/>
    <!-- Manga derecha (vista espectador) -->
    <path d="M142 53 L172 116 L152 123 L135 82 Z" fill="url(#sleeve-right-grad)" stroke="#1B629B" stroke-width="1"/>

    <!-- Tronco principal del jersey -->
    <path d="M58 53 L76 43 L100 48 L124 43 L142 53 L136 84 L136 157 C136 159 134 160 131 160 L69 160 C66 160 64 159 64 157 L64 84 Z" 
          fill="url(#jersey-body-grad)" stroke="#1A619A" stroke-width="1.2"/>

    <!-- Efecto sutil de textura de punto / pliegues naturales -->
    <path d="M68 85 Q75 120 70 156" stroke="#4DA0DF" stroke-width="0.8" fill="none" opacity="0.4"/>
    <path d="M132 85 Q125 120 130 156" stroke="#134C7A" stroke-width="0.8" fill="none" opacity="0.35"/>
    <path d="M90 92 Q89 125 91 156" stroke="#4DA0DF" stroke-width="0.6" fill="none" opacity="0.25"/>
    <path d="M110 92 Q111 125 109 156" stroke="#134C7A" stroke-width="0.6" fill="none" opacity="0.25"/>

    <!-- 3. Cuello en V de punto canalé reforzado -->
    <!-- Borde exterior del pico -->
    <path d="M76 43 L100 89 L124 43" fill="none" stroke="url(#rib-grad)" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Línea viva interior más clara para brillo del canalé -->
    <path d="M77 44 L100 86 L123 44" fill="none" stroke="#4EA2E2" stroke-width="1.5" stroke-linejoin="round" opacity="0.85"/>
    <!-- Detalle de costura pico -->
    <line x1="100" y1="88" x2="100" y2="94" stroke="#10446D" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 4. Puños acanalados en mangas -->
    <g transform="rotate(18 38 120)">
      <rect x="27" y="115" width="22" height="11" rx="2.5" fill="url(#rib-grad)" stroke="#165180" stroke-width="0.8"/>
      <line x1="30" y1="118" x2="46" y2="118" stroke="#4DA0DF" stroke-width="0.8" opacity="0.7"/>
      <line x1="30" y1="121" x2="46" y2="121" stroke="#4DA0DF" stroke-width="0.8" opacity="0.7"/>
    </g>

    <g transform="rotate(-18 162 120)">
      <rect x="151" y="115" width="22" height="11" rx="2.5" fill="url(#rib-grad)" stroke="#165180" stroke-width="0.8"/>
      <line x1="154" y1="118" x2="170" y2="118" stroke="#4DA0DF" stroke-width="0.8" opacity="0.7"/>
      <line x1="154" y1="121" x2="170" y2="121" stroke="#4DA0DF" stroke-width="0.8" opacity="0.7"/>
    </g>

    <!-- 5. Cinturilla acanalada elástica inferior -->
    <rect x="64" y="155" width="72" height="14" rx="3" fill="url(#rib-grad)" stroke="#154F7D" stroke-width="0.9"/>
    <!-- Textura de elástico de canalé -->
    <line x1="66" y1="158" x2="134" y2="158" stroke="#4DA0DF" stroke-width="0.9" opacity="0.6"/>
    <line x1="66" y1="162" x2="134" y2="162" stroke="#124368" stroke-width="0.9" opacity="0.8"/>
    <line x1="66" y1="165" x2="134" y2="165" stroke="#4DA0DF" stroke-width="0.9" opacity="0.4"/>

    <!-- 6. Escudo bordado oficial CSB en el pecho izquierdo -->
    <g transform="translate(116,94) scale(0.68)">
      <!-- Sombra / Realce de bordado sobre punto -->
      <ellipse cx="0" cy="0" rx="14" ry="14" fill="#0E3C62" opacity="0.35"/>
      <circle cx="0" cy="-2" r="13" fill="#FFFFFF" opacity="0.15"/>
      
      <!-- Figura central franciscana (Cuerpo dorado, cabeza azul) -->
      <circle cx="0" cy="-11" r="4.2" fill="#005CB9"/>
      <path d="M-3.5 -5 L3.5 -5 C4.5 -5 5.5 -4 5.5 -2.5 L5.5 10 C5.5 11 4.5 12 3.5 12 L-3.5 12 C-4.5 12 -5.5 11 -5.5 10 L-5.5 -2.5 C-5.5 -4 -4.5 -5 -3.5 -5 Z" fill="#F5A623"/>
      
      <!-- Figura izquierda (Cabeza dorada, cuerpo azul) -->
      <circle cx="-7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M-10.5 -1 L-4.5 -1 C-3.8 -1 -3.3 -0.5 -3.3 0.5 L-3.3 9 C-3.3 10 -3.8 10.5 -4.5 10.5 L-10.5 10.5 C-11.2 10.5 -11.7 10 -11.7 9 L-11.7 0.5 C-11.7 -0.5 -11.2 -1 -10.5 -1 Z" fill="#005CB9"/>
      
      <!-- Figura derecha (Cabeza dorada, cuerpo azul con Cruz Tau) -->
      <circle cx="7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M4.5 -1 L10.5 -1 C11.2 -1 11.7 -0.5 11.7 0.5 L11.7 9 C11.7 10 11.2 10.5 10.5 10.5 L4.5 10.5 C3.8 10.5 3.3 10 3.3 9 L3.3 0.5 C3.3 -0.5 3.8 -1 4.5 -1 Z" fill="#005CB9"/>
      
      <!-- Cruz Tau franciscana bordada en blanco -->
      <path d="M6 2 L9 2 M7.5 2 L7.5 6" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Texto bordado oficial inferior -->
    <text x="116" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="3.3" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4" opacity="0.95">SAN BUENAVENTURA</text>
  </g>
</svg>
