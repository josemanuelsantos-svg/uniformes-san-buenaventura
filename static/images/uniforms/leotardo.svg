<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <!-- Leotardo Escolar Azul Marino CSB -->
  <g filter="url(#card-shadow)">
    <!-- Waistband -->
    <rect x="72" y="32" width="56" height="12" fill="#16283D" rx="2" stroke="#0C1E3A" stroke-width="1"/>
    <line x1="72" y1="38" x2="128" y2="38" stroke="#233B58" stroke-width="1"/>
    <!-- Tights Body & Legs with smooth knit stretch lines -->
    <path d="M72 44 L66 142 C66 156 54 160 54 168 C54 174 68 174 74 168 C80 162 82 148 82 142 L96 74 L104 74 L118 142 C118 148 120 162 126 168 C132 174 146 174 146 168 C146 160 134 156 134 142 L128 44 Z" fill="#0D1B2A" stroke="#060D15" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Subtle knit rib lines -->
    <line x1="74" y1="55" x2="74" y2="135" stroke="#1E3A8A" stroke-width="1" opacity="0.5"/>
    <line x1="126" y1="55" x2="126" y2="135" stroke="#1E3A8A" stroke-width="1" opacity="0.5"/>
  </g>

</svg>