<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <!-- Chaqueta de Chándal CSB -->
  <g filter="url(#card-shadow)">
    <!-- Dark Navy lower section and outer sleeves -->
    <path d="M62 48 L76 38 L100 44 L124 38 L138 48 L168 88 L148 104 L134 90 L134 165 C134 168 131 170 128 170 L72 170 C69 170 66 168 66 165 L66 90 L52 104 L32 88 Z" fill="#0D1B2A" stroke="#09121C" stroke-width="1.5"/>
    <!-- Royal Blue upper chest & upper sleeves block -->
    <path d="M62 48 L76 38 L100 44 L124 38 L138 48 L157 74 L134 74 L134 82 L66 82 L66 74 L43 74 Z" fill="#1B5EBF"/>
    <!-- Bold White horizontal band across mid-chest and sleeves -->
    <path d="M43 74 L157 74 L162 80 L134 92 L66 92 L38 80 Z" fill="#FFFFFF"/>
    <!-- Front zipper track -->
    <line x1="100" y1="44" x2="100" y2="170" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="98" y="50" width="4" height="6" fill="#FFFFFF" stroke="#64748B" stroke-width="0.8" rx="1"/>
    <!-- Stand/fold collar -->
    <path d="M76 38 L100 52 L64 48 Z" fill="#0D1B2A" stroke="#1B5EBF" stroke-width="1.5"/>
    <path d="M124 38 L100 52 L136 48 Z" fill="#0D1B2A" stroke="#1B5EBF" stroke-width="1.5"/>
    <!-- Side pockets -->
    <line x1="74" y1="120" x2="74" y2="145" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <line x1="126" y1="120" x2="126" y2="145" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
    <!-- Ribbed cuffs and hem -->
    <rect x="66" y="164" width="68" height="6" fill="#07101B"/>
    
    <!-- Official CSB Emblem -->
    <g transform="translate(118,66) scale(0.65)">
      <!-- Shadow/backing subtle glow -->
      <circle cx="0" cy="-2" r="14" fill="#FFFFFF" opacity="0.2"/>
      <!-- Center figure (Gold body, Blue head) -->
      <circle cx="0" cy="-11" r="4.2" fill="#005CB9"/>
      <path d="M-3.5 -5 L3.5 -5 C4.5 -5 5.5 -4 5.5 -2.5 L5.5 10 C5.5 11 4.5 12 3.5 12 L-3.5 12 C-4.5 12 -5.5 11 -5.5 10 L-5.5 -2.5 C-5.5 -4 -4.5 -5 -3.5 -5 Z" fill="#F5A623"/>
      <!-- Left figure (Gold head, Blue body) -->
      <circle cx="-7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M-10.5 -1 L-4.5 -1 C-3.8 -1 -3.3 -0.5 -3.3 0.5 L-3.3 9 C-3.3 10 -3.8 10.5 -4.5 10.5 L-10.5 10.5 C-11.2 10.5 -11.7 10 -11.7 9 L-11.7 0.5 C-11.7 -0.5 -11.2 -1 -10.5 -1 Z" fill="#005CB9"/>
      <!-- Right figure (Gold head, Blue body with Tau) -->
      <circle cx="7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M4.5 -1 L10.5 -1 C11.2 -1 11.7 -0.5 11.7 0.5 L11.7 9 C11.7 10 11.2 10.5 10.5 10.5 L4.5 10.5 C3.8 10.5 3.3 10 3.3 9 L3.3 0.5 C3.3 -0.5 3.8 -1 4.5 -1 Z" fill="#005CB9"/>
      <!-- White Tau Cross -->
      <path d="M6 2 L9 2 M7.5 2 L7.5 6" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    
  </g>

</svg>