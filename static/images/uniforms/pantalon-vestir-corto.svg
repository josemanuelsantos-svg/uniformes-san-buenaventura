<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <!-- Pantalon Vestir Corto San Buenaventura -->
  <g filter="url(#card-shadow)">
    <!-- Waistband -->
    <path d="M64 55 L136 55 L136 66 L64 66 Z" fill="#475569" stroke="#334155" stroke-width="1" rx="2"/>
    <!-- Button & Belt Loops -->
    <circle cx="100" cy="60.5" r="2" fill="#1E293B" stroke="#94A3B8" stroke-width="0.6"/>
    <rect x="71" y="55" width="3" height="11" fill="#334155"/>
    <rect x="85" y="55" width="3" height="11" fill="#334155"/>
    <rect x="112" y="55" width="3" height="11" fill="#334155"/>
    <rect x="126" y="55" width="3" height="11" fill="#334155"/>
    <!-- Bermuda Legs -->
    <path d="M64 66 L55 145 L94 145 L100 96 L106 145 L145 145 L136 66 Z" fill="#5A697E" stroke="#334155" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Fly seam & pockets -->
    <path d="M100 66 L100 90 C100 94 96 96 92 96" fill="none" stroke="#334155" stroke-width="1.2"/>
    <path d="M66 70 L80 86" stroke="#334155" stroke-width="1.2"/>
    <path d="M134 70 L120 86" stroke="#334155" stroke-width="1.2"/>
    <!-- Bottom Hem turn-up line -->
    <line x1="55" y1="138" x2="94" y2="138" stroke="#475569" stroke-width="1"/>
    <line x1="106" y1="138" x2="145" y2="138" stroke="#475569" stroke-width="1"/>
  </g>

</svg>