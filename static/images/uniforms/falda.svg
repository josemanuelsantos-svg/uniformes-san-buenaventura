<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <defs>
    <!-- Windowpane plaid pattern -->
    <pattern id="skirt-plaid" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#475569"/>
      <line x1="0" y1="0" x2="14" y2="0" stroke="#38BDF8" stroke-width="0.8" opacity="0.6"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#38BDF8" stroke-width="0.8" opacity="0.6"/>
      <line x1="7" y1="0" x2="7" y2="14" stroke="#1E293B" stroke-width="0.6" opacity="0.5"/>
      <line x1="0" y1="7" x2="14" y2="7" stroke="#1E293B" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <g filter="url(#card-shadow)">
    <!-- Suspenders / Tirantes -->
    <rect x="78" y="32" width="10" height="65" fill="url(#skirt-plaid)" stroke="#334155" stroke-width="1"/>
    <rect x="112" y="32" width="10" height="65" fill="url(#skirt-plaid)" stroke="#334155" stroke-width="1"/>
    <!-- Horizontal back brace band -->
    <rect x="88" y="58" width="24" height="7" fill="url(#skirt-plaid)" stroke="#334155" stroke-width="0.8"/>
    <!-- Skirt Waistband -->
    <path d="M68 94 C68 94 100 92 132 94 L134 104 C134 104 100 102 66 104 Z" fill="#334155" stroke="#1E293B" stroke-width="1"/>
    <circle cx="128" cy="99" r="2.2" fill="#1E293B" stroke="#64748B" stroke-width="0.8"/>
    <!-- Skirt Pleated Body with Plaid -->
    <path d="M66 104 L50 168 C50 168 100 172 150 168 L134 104 Z" fill="url(#skirt-plaid)" stroke="#334155" stroke-width="1.5"/>
    <!-- Knife Pleats Shadows/Highlights -->
    <line x1="76" y1="104" x2="64" y2="168" stroke="#1E293B" stroke-width="1.8" opacity="0.7"/>
    <line x1="88" y1="104" x2="80" y2="169" stroke="#1E293B" stroke-width="1.8" opacity="0.7"/>
    <line x1="100" y1="103" x2="100" y2="170" stroke="#1E293B" stroke-width="1.8" opacity="0.7"/>
    <line x1="112" y1="104" x2="120" y2="169" stroke="#1E293B" stroke-width="1.8" opacity="0.7"/>
    <line x1="124" y1="104" x2="136" y2="168" stroke="#1E293B" stroke-width="1.8" opacity="0.7"/>
  </g>

</svg>