<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <!-- Chándal Infantil Completo CSB -->
  <g filter="url(#card-shadow)">
    <!-- TOP SWEATSHIRT -->
    <g transform="translate(0, -5)">
      <!-- Blue Body & Sleeves -->
      <path d="M62 48 L76 38 L100 44 L124 38 L138 48 L168 85 L150 98 L134 86 L134 118 L66 118 L66 86 L50 98 L32 85 Z" fill="#3B82F6" stroke="#2563EB" stroke-width="1.2"/>
      <!-- Contrast Dark Navy Collar -->
      <path d="M76 38 L100 52 L64 48 Z" fill="#0D1B2A" stroke="#060D15" stroke-width="1"/>
      <path d="M124 38 L100 52 L136 48 Z" fill="#0D1B2A" stroke="#060D15" stroke-width="1"/>
      <!-- Placket & Buttons -->
      <rect x="96" y="50" width="8" height="20" fill="#2563EB" rx="1"/>
      <circle cx="100" cy="56" r="1.2" fill="#0D1B2A"/>
      <circle cx="100" cy="64" r="1.2" fill="#0D1B2A"/>
      <!-- Dark Navy Wrist Cuffs -->
      <rect x="31" y="82" width="18" height="8" fill="#0D1B2A" transform="rotate(35 40 86)" rx="1"/>
      <rect x="151" y="82" width="18" height="8" fill="#0D1B2A" transform="rotate(-35 160 86)" rx="1"/>
      <!-- Bright Yellow Circular Elbow Patch on Right Sleeve -->
      <circle cx="45" cy="70" r="7" fill="#F5A623" stroke="#D97706" stroke-width="0.8"/>
      <!-- CSB badge on chest -->
      
    <!-- Official CSB Emblem -->
    <g transform="translate(116,68) scale(0.55)">
      <!-- Shadow/backing subtle glow -->
      <circle cx="0" cy="-2" r="14" fill="#FFFFFF" opacity="0.2"/>
      <!-- Center figure (Gold body, Blue head) -->
      <circle cx="0" cy="-11" r="4.2" fill="#005CB9"/>
      <path d="M-3.5 -5 L3.5 -5 C4.5 -5 5.5 -4 5.5 -2.5 L5.5 10 C5.5 11 4.5 12 3.5 12 L-3.5 12 C-4.5 12 -5.5 11 -5.5 10 L-5.5 -2.5 C-5.5 -4 -4.5 -5 -3.5 -5 Z" fill="#F5A623"/>
      <!-- Left figure (Gold head, Blue body) -->
      <circle cx="-7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M-10.5 -1 L-4.5 -1 C-3.8 -1 -3.3 -0.5 -3.3 0.5 L-3.3 9 C-3.3 10 -3.8 10.5 -4.5 10.5 L-10.5 10.5 C-11.2 10.5 -11.7 10 -11.7 9 L-11.7 0.5 C-11.7 -0.5 -11.2 -1 -10.5 -1 Z" fill="#005CB9"/>
      <!-- Right figure (Gold head, Blue body with Tau) -->
      <circle cx="7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M4.5 -1 L10.5 -1 C11.2 -1 11.7 -0.5 11.7 0.5 L11.7 9 C11.7 10 11.2 10.5 10.5 10.5 L4.5 10.5 C3.8 10.5 3.3 10 3.3 9 L3.3 0.5 C3.3 -0.5 3.8 -1 4.5 -1 Z" fill="#005CB9"/>
      <!-- White Tau Cross -->
      <path d="M6 2 L9 2 M7.5 2 L7.5 6" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    
    </g>

    <!-- BOTTOM PANTS -->
    <g transform="translate(0, 114)">
      <path d="M68 5 L132 5 L130 76 L108 76 L100 32 L92 76 L70 76 Z" fill="#0D1B2A" stroke="#060D15" stroke-width="1.2"/>
      <!-- Waistband -->
      <rect x="68" y="5" width="64" height="7" fill="#1A2C42" rx="1"/>
      <!-- Parches en cada pierna: uno amarillo y otro azul celeste -->
      <circle cx="81" cy="44" r="8" fill="#8EBEEC" stroke="#0C4A9E" stroke-width="0.8"/>
      <circle cx="119" cy="44" r="8" fill="#F5A623" stroke="#D97706" stroke-width="0.8"/>
    </g>
  </g>

</svg>