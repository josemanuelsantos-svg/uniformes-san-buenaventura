<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <!-- Calcetín Largo Colegial CSB -->
  <g filter="url(#card-shadow)">
    <!-- Left sock (slightly angled) -->
    <g transform="translate(55, 30)">
      <rect x="0" y="0" width="28" height="18" rx="2" fill="#16283D" stroke="#0D1B2A" stroke-width="1"/>
      <line x1="0" y1="6" x2="28" y2="6" stroke="#233B58" stroke-width="1"/>
      <line x1="0" y1="12" x2="28" y2="12" stroke="#233B58" stroke-width="1"/>
      <path d="M0 18 L0 105 C0 118 -6 126 -6 134 C-6 142 8 142 16 136 C24 130 28 116 28 105 L28 18 Z" fill="#0D1B2A" stroke="#060D15" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Heel & toe curves -->
      <path d="M22 105 C28 112 28 118 20 122" fill="none" stroke="#1E293B" stroke-width="1.2"/>
    </g>
    <!-- Right sock -->
    <g transform="translate(115, 30)">
      <rect x="0" y="0" width="28" height="18" rx="2" fill="#16283D" stroke="#0D1B2A" stroke-width="1"/>
      <line x1="0" y1="6" x2="28" y2="6" stroke="#233B58" stroke-width="1"/>
      <line x1="0" y1="12" x2="28" y2="12" stroke="#233B58" stroke-width="1"/>
      <path d="M0 18 L0 105 C0 116 4 130 12 136 C20 142 34 142 34 134 C34 126 28 118 28 105 L28 18 Z" fill="#0D1B2A" stroke="#060D15" stroke-width="1.2" stroke-linejoin="round"/>
      <!-- Heel & toe curves -->
      <path d="M6 105 C0 112 0 118 8 122" fill="none" stroke="#1E293B" stroke-width="1.2"/>
    </g>
  </g>

</svg>