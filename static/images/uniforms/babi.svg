<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <defs>
    <!-- Gingham vichy pattern: micro-cuadro vichy oficial CSB (pequeño y fino, evitar cuadros grandes no oficiales) -->
    <pattern id="vichy-pattern" width="3.5" height="3.5" patternUnits="userSpaceOnUse">
      <rect width="3.5" height="3.5" fill="#FFFFFF"/>
      <rect x="0" y="0" width="1.75" height="1.75" fill="#2563EB" opacity="0.6"/>
      <rect x="1.75" y="1.75" width="1.75" height="1.75" fill="#2563EB" opacity="0.6"/>
      <rect x="0" y="0" width="1.75" height="1.75" fill="#1E3A8A" opacity="0.45"/>
      <rect x="1.75" y="0" width="1.75" height="1.75" fill="#1E3A8A" opacity="0.2"/>
      <rect x="0" y="1.75" width="1.75" height="1.75" fill="#1E3A8A" opacity="0.2"/>
      <rect x="1.75" y="1.75" width="1.75" height="1.75" fill="#1E3A8A" opacity="0.45"/>
    </pattern>
  </defs>
  <g filter="url(#card-shadow)">
    <!-- Sleeves with elastic ruffled cuffs -->
    <path d="M58 55 L28 108 L46 114 L62 82 Z" fill="url(#vichy-pattern)" stroke="#1E3A8A" stroke-width="1"/>
    <path d="M142 55 L172 108 L154 114 L138 82 Z" fill="url(#vichy-pattern)" stroke="#1E3A8A" stroke-width="1"/>
    <!-- Ruffled sleeve cuffs -->
    <path d="M26 106 C28 112 44 118 46 112" stroke="#1E3A8A" stroke-width="2" fill="none"/>
    <path d="M174 106 C172 112 156 118 154 112" stroke="#1E3A8A" stroke-width="2" fill="none"/>
    <!-- Babi Smock Body -->
    <path d="M58 55 L75 42 L100 46 L125 42 L142 55 L156 168 L44 168 Z" fill="url(#vichy-pattern)" stroke="#1E3A8A" stroke-width="1.2"/>
    <!-- Navy Chest Piping Line -->
    <line x1="54" y1="76" x2="146" y2="76" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    <!-- Center Button Placket -->
    <line x1="100" y1="76" x2="100" y2="168" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="1 2"/>
    <!-- Alternating Red & Yellow Front Buttons -->
    <circle cx="100" cy="86" r="2.5" fill="#EF4444" stroke="#B91C1C" stroke-width="0.6"/>
    <circle cx="100" cy="104" r="2.5" fill="#F5A623" stroke="#D97706" stroke-width="0.6"/>
    <circle cx="100" cy="122" r="2.5" fill="#EF4444" stroke="#B91C1C" stroke-width="0.6"/>
    <circle cx="100" cy="140" r="2.5" fill="#F5A623" stroke="#D97706" stroke-width="0.6"/>
    <!-- CONTRAST POCKETS -->
    <!-- Right Pocket (Viewer Left): BRIGHT RED with CSB badge -->
    <rect x="54" y="116" width="26" height="34" rx="3" fill="#EF4444" stroke="#DC2626" stroke-width="1"/>
    
    <!-- Official CSB Emblem -->
    <g transform="translate(67,133) scale(0.45)">
      <!-- Shadow/backing subtle glow -->
      <circle cx="0" cy="-2" r="14" fill="#FFFFFF" opacity="0.2"/>
      <!-- Center figure (Gold body, Blue head) -->
      <circle cx="0" cy="-11" r="4.2" fill="#005CB9"/>
      <path d="M-3.5 -5 L3.5 -5 C4.5 -5 5.5 -4 5.5 -2.5 L5.5 10 C5.5 11 4.5 12 3.5 12 L-3.5 12 C-4.5 12 -5.5 11 -5.5 10 L-5.5 -2.5 C-5.5 -4 -4.5 -5 -3.5 -5 Z" fill="#F5A623"/>
      <!-- Left figure (Gold head, Blue body) -->
      <circle cx="-7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M-10.5 -1 L-4.5 -1 C-3.8 -1 -3.3 -0.5 -3.3 0.5 L-3.3 9 C-3.3 10 -3.8 10.5 -4.5 10.5 L-10.5 10.5 C-11.2 10.5 -11.7 10 -11.7 9 L-11.7 0.5 C-11.7 -0.5 -11.2 -1 -10.5 -1 Z" fill="#005CB9"/>
      <!-- Right figure (Gold head, Blue body with Tau) -->
      <circle cx="7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M4.5 -1 L10.5 -1 C11.2 -1 11.7 -0.5 11.7 0.5 L11.7 9 C11.7 10 11.2 10.5 10.5 10.5 L4.5 10.5 C3.8 10.5 3.3 10 3.3 9 L3.3 0.5 C3.3 -0.5 3.8 -1 4.5 -1 Z" fill="#005CB9"/>
      <!-- White Tau Cross -->
      <path d="M6 2 L9 2 M7.5 2 L7.5 6" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    
    <!-- Left Pocket (Viewer Right): BRIGHT YELLOW -->
    <rect x="120" y="116" width="26" height="34" rx="3" fill="#F5A623" stroke="#D97706" stroke-width="1"/>
    <!-- CONTRAST PETER PAN COLLAR -->
    <!-- Left lobe (Viewer Left): BRIGHT YELLOW -->
    <path d="M100 46 C95 44 80 40 70 50 C62 58 76 68 95 56 Z" fill="#F5A623" stroke="#D97706" stroke-width="1.2"/>
    <!-- Right lobe (Viewer Right): BRIGHT RED -->
    <path d="M100 46 C105 44 120 40 130 50 C138 58 124 68 105 56 Z" fill="#EF4444" stroke="#DC2626" stroke-width="1.2"/>
    <circle cx="100" cy="49" r="2" fill="#F5A623" stroke="#D97706" stroke-width="0.5"/>
  </g>

</svg>