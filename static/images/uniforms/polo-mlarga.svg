<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg-grad)" rx="20"/>
  
  <!-- Polo Manga Larga San Buenaventura -->
  <g filter="url(#card-shadow)">
    <!-- Long sleeve arms -->
    <path d="M62 55 L32 120 L48 126 L66 85 Z" fill="#8EBEEC" stroke="#6AA2D9" stroke-width="1.5"/>
    <path d="M138 55 L168 120 L152 126 L134 85 Z" fill="#8EBEEC" stroke="#6AA2D9" stroke-width="1.5"/>
    <!-- Torso Body -->
    <path d="M62 55 L75 42 L100 50 L125 42 L138 55 L134 165 C134 168 131 170 128 170 L72 170 C69 170 66 168 66 165 Z" fill="#8EBEEC" stroke="#6AA2D9" stroke-width="1.5"/>
    <!-- Long sleeve ribbed striped cuffs -->
    <path d="M31 117 L47 124 L45 130 L29 123 Z" fill="#0C4A9E"/>
    <path d="M31 120 L47 127" stroke="#8EBEEC" stroke-width="1.5"/>
    <path d="M169 117 L153 124 L155 130 L171 123 Z" fill="#0C4A9E"/>
    <path d="M169 120 L153 127" stroke="#8EBEEC" stroke-width="1.5"/>
    <!-- Collar -->
    <path d="M75 42 L100 72 L64 58 Z" fill="#7AAEE2" stroke="#0C4A9E" stroke-width="2" stroke-linejoin="round"/>
    <path d="M125 42 L100 72 L136 58 Z" fill="#7AAEE2" stroke="#0C4A9E" stroke-width="2" stroke-linejoin="round"/>
    <!-- Placket & Buttons -->
    <rect x="94" y="68" width="12" height="36" fill="#82B5E6" stroke="#6AA2D9" stroke-width="1" rx="2"/>
    <circle cx="100" cy="75" r="1.8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
    <circle cx="100" cy="85" r="1.8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
    <circle cx="100" cy="95" r="1.8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.5"/>
    
    <!-- Official CSB Emblem -->
    <g transform="translate(118,92) scale(0.65)">
      <!-- Shadow/backing subtle glow -->
      <circle cx="0" cy="-2" r="14" fill="#FFFFFF" opacity="0.2"/>
      <!-- Center figure (Gold body, Blue head) -->
      <circle cx="0" cy="-11" r="4.2" fill="#005CB9"/>
      <path d="M-3.5 -5 L3.5 -5 C4.5 -5 5.5 -4 5.5 -2.5 L5.5 10 C5.5 11 4.5 12 3.5 12 L-3.5 12 C-4.5 12 -5.5 11 -5.5 10 L-5.5 -2.5 C-5.5 -4 -4.5 -5 -3.5 -5 Z" fill="#F5A623"/>
      <!-- Left figure (Gold head, Blue body) -->
      <circle cx="-7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M-10.5 -1 L-4.5 -1 C-3.8 -1 -3.3 -0.5 -3.3 0.5 L-3.3 9 C-3.3 10 -3.8 10.5 -4.5 10.5 L-10.5 10.5 C-11.2 10.5 -11.7 10 -11.7 9 L-11.7 0.5 C-11.7 -0.5 -11.2 -1 -10.5 -1 Z" fill="#005CB9"/>
      <!-- Right figure (Gold head, Blue body with Tau) -->
      <circle cx="7.5" cy="-6" r="3.3" fill="#F5A623"/>
      <path d="M4.5 -1 L10.5 -1 C11.2 -1 11.7 -0.5 11.7 0.5 L11.7 9 C11.7 10 11.2 10.5 10.5 10.5 L4.5 10.5 C3.8 10.5 3.3 10 3.3 9 L3.3 0.5 C3.3 -0.5 3.8 -1 4.5 -1 Z" fill="#005CB9"/>
      <!-- White Tau Cross -->
      <path d="M6 2 L9 2 M7.5 2 L7.5 6" stroke="#FFFFFF" stroke-width="1.1" stroke-linecap="round"/>
    </g>
    
  </g>

</svg>