<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente Azul Oficial CSB -->
    <linearGradient id="csbBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#002B66"/>
    </linearGradient>
    <!-- Gradiente Amarillo/Oro Oficial CSB -->
    <linearGradient id="csbGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB81C"/>
      <stop offset="100%" stop-color="#E58A00"/>
    </linearGradient>
    <!-- Sombra suave para dar volumen tipo app icon -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#001833" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#iconGlow)">
    <!-- Figura Central (Cabeza Azul, Cuerpo Dorado) -->
    <circle cx="32" cy="15" r="9" fill="url(#csbBlue)"/>
    <path d="M23 28 C23 25 25 24 28 24 L36 24 C39 24 41 25 41 28 L41 57 C41 59 39 60 37 60 L27 60 C25 60 23 59 23 57 Z" fill="url(#csbGold)"/>

    <!-- Figura Izquierda (Cabeza Dorada, Cuerpo Azul) -->
    <circle cx="15.5" cy="25" r="7.5" fill="url(#csbGold)"/>
    <path d="M8 36 C8 34 9.5 33 11.5 33 L19.5 33 C21.5 33 23 34 23 36 L23 56 C23 58 21.5 59 19.5 59 L11.5 59 C9.5 59 8 58 8 56 Z" fill="url(#csbBlue)"/>

    <!-- Figura Derecha (Cabeza Dorada, Cuerpo Azul con Cruz Tau blanca) -->
    <circle cx="48.5" cy="25" r="7.5" fill="url(#csbGold)"/>
    <path d="M41 36 C41 34 42.5 33 44.5 33 L52.5 33 C54.5 33 56 34 56 36 L56 56 C56 58 54.5 59 52.5 59 L44.5 59 C42.5 59 41 58 41 56 Z" fill="url(#csbBlue)"/>

    <!-- Cruz Franciscana Tau Blanca -->
    <path d="M44.5 44 L52.5 44 M48.5 44 L48.5 53" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
